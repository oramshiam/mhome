<!DOCTYPE html>
<html>
<head>
  <title>Watch List</title>
  <style>
    body {
      background-color: #121212; /* 검정 배경 */
      color: white;              /* 흰 글씨 */
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    input[type="text"] {
      background-color: #1e1e1e;
      color: white;
      border: 1px solid #444;
      padding: 8px;
      border-radius: 4px;
    }

    textarea {
      background-color: #1e1e1e;
      color: white;
      border: 1px solid #444;
      padding: 6px;
      border-radius: 4px;
    }

    button {
      background-color: #333;
      color: white;
      border: 1px solid #666;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #555;
    }

    li {
      background-color: #292238;
      padding: 10px;
      border-radius: 8px;
    }

    .column {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .row {
      display: flex;
      flex-direction: row;
      gap: 10px;
    }

    .button-link {
    display: inline-block;
    padding: 5px 10px;
    background-color: #545454;
    color: #ffffff;
    text-decoration: none;
    border-radius: 4px;
    border: none;
    cursor: pointer;
    font-size: 14px;
    }

  </style>
</head>
<body>
  <div style="width:100%; padding-right: 2px;"> 
    <div class="row" style="width: 100%;">
      <div id="stockPrice" class="row" style="width: 100%; align-items: flex-start; margin-top: 20px; justify-content: flex-end;">
        <div class="column" style="width: 70%;">
          <div class="row" style="margin-top: 152px; align-items: flex-end; padding-right: 20px;">
            <button onclick="loadFromSheet()" style="width:16%;">Update from Sheet</button>
            <a href="https://docs.google.com/spreadsheets/d/1TLSxhA2vpDmesfNaMoofD7Xf04CswB6bdxg3_fN7GQ0/edit?gid=0#gid=0" target="_blank" rel="noreferrer noopener" class="button-link">US</a>
            <a href="https://docs.google.com/spreadsheets/d/1TLSxhA2vpDmesfNaMoofD7Xf04CswB6bdxg3_fN7GQ0/edit?gid=640910317#gid=640910317" target="_blank" rel="noreferrer noopener" class="button-link">KR</a>
          </div>
          <ul id="watchList-list" style="list-style: none; margin: 0; padding: 0;"></ul>
          <form id="watchList-form" style="padding-bottom: 5px; text-align: right;">
            <input type="text" required placeholder="Watch List" style="width:20%;">
          </form>
        </div>
  
        <iframe 
        src="https://docs.google.com/spreadsheets/d/1TLSxhA2vpDmesfNaMoofD7Xf04CswB6bdxg3_fN7GQ0/edit?usp=sharing" 
        width="30%" 
        height="10000" 
        frameborder="0"
        style="margin-top: 20px; border: 1px solid #444;">
        </iframe>
    </div>
  </div>
  <script src="js/watchList.js"></script>
</body>
</html>
